name: Backoffice CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backoffice-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm check
        env:
          ASTRO_API_URL: http://api:3000
          NEXT_PUBLIC_CHECKOUT_URL: https://checkout.example.com
      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_CHECKOUT_URL=https://checkout.example.com -t astro-backoffice:${{ github.sha }} .
