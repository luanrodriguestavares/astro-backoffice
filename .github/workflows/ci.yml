name: Backoffice CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backoffice-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backoffice
    steps:
      # `@astro/checkout-renderer` é `file:../checkout-renderer`: os dois repositórios ficam lado a
      # lado, como no desenvolvimento local.
      - uses: actions/checkout@v4
        with:
          path: backoffice
      - uses: actions/checkout@v4
        with:
          repository: luanrodriguestavares/astro-checkout-renderer
          path: checkout-renderer
          # Deploy key só de leitura no astro-checkout-renderer (repositório privado).
          ssh-key: ${{ secrets.CHECKOUT_RENDERER_SSH_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backoffice/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backoffice/pnpm-lock.yaml
            checkout-renderer/pnpm-lock.yaml
      - name: Install renderer dependencies
        working-directory: checkout-renderer
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm check
        env:
          ASTRO_API_URL: http://api:3000
          NEXT_PUBLIC_CHECKOUT_URL: https://checkout.example.com
          NEXT_PUBLIC_LANDING_URL: https://landing.example.com
      - name: Build production image
        working-directory: .
        run: docker build -f backoffice/Dockerfile --build-arg NEXT_PUBLIC_CHECKOUT_URL=https://checkout.example.com --build-arg NEXT_PUBLIC_LANDING_URL=https://landing.example.com -t astro-backoffice:${{ github.sha }} .

  deploy:
    name: Deploy no Cloudflare
    # Push na main ou disparo manual (ex.: para publicar uma mudança do renderer), sempre depois
    # da validação passar.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backoffice-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backoffice
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: backoffice
      - uses: actions/checkout@v4
        with:
          repository: luanrodriguestavares/astro-checkout-renderer
          path: checkout-renderer
          # Deploy key só de leitura no astro-checkout-renderer (repositório privado).
          ssh-key: ${{ secrets.CHECKOUT_RENDERER_SSH_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backoffice/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backoffice/pnpm-lock.yaml
            checkout-renderer/pnpm-lock.yaml
      - name: Install renderer dependencies
        working-directory: checkout-renderer
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      # As URLs de produção estão nos próprios scripts build:vinext/deploy:vinext.
      - run: pnpm build:vinext
      - run: pnpm deploy:vinext
